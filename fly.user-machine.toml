app = "mainroom-user-machines"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.user-machine"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
